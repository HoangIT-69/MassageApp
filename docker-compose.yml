services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: zalo_root
      MYSQL_DATABASE: zalo_chat
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pzalo_root"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - zalo-mysql:/var/lib/mysql

  minio:
    build: ./docker/minio
    image: zalo-minio:local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - zalo-minio:/data

  minio-init:
    image: zalo-minio:local
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        mc mb --ignore-existing local/zalo-photos
        exit 0

volumes:
  zalo-mysql:
  zalo-minio:
